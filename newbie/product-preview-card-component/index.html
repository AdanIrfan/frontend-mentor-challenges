<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Product preview card component</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container">
      <div class="product-card">
        <picture>
          <source
            media="(min-width: 600px)"
            srcset="./images/image-product-desktop.jpg"
            id="desktop-img"
          />
          <img
            src="./images/image-product-mobile.jpg"
            alt="Chanel Gabrielle Essence perfume bottle on a table beside green leaves"
            id="mob-img"
          />
        </picture>
        <div class="description">
          <p class="category">PERFUME</p>
          <h1>Gabrielle Essence Eau De Parfum</h1>
          <p>
            A floral, solar and voluptuous interpretation composed by Olivier
            Polge, Perfumer-Creator for the House of CHANEL.
          </p>
          <div class="price">
            <span class="new-price">$149.99</span>
            <del class="old-price" aria-label="Original price $169.99">
              $169.99
            </del>
          </div>
          <button type="button">
            <img src="./images/icon-cart.svg" alt="" />
            Add to Cart
          </button>
        </div>
      </div>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="https://github.com/AdanIrfan">AdanIrfan</a>.
    </footer>
  </body>
</html>
